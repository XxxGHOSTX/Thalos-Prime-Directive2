version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thalos-prime
    # Published ports are host-loopback-only. Do not remove 127.0.0.1 without review.
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    environment:
      - APP_ENV=development
      - APP_PORT=8080
      # Bind inside the container; host port publication above stays loopback-only.
      - APP_HOST=0.0.0.0
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - ENABLE_METRICS=true
      - METRICS_PORT=9090
      - ENABLE_HEALTH_CHECKS=true
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - THALOS_API_TOKEN
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    networks:
      - thalos-network

networks:
  thalos-network:
    driver: bridge
