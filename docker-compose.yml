version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thalos-prime
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      - APP_ENV=development
      - APP_PORT=8080
      - APP_HOST=0.0.0.0
      - LOG_LEVEL=debug
      - LOG_FORMAT=pretty
      - ENABLE_METRICS=true
      - METRICS_PORT=9090
      - ENABLE_HEALTH_CHECKS=true
    volumes:
      - ./src:/app/src:ro
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    networks:
      - thalos-network

  # Uncomment for database
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: thalos-db
  #   environment:
  #     - POSTGRES_USER=thalos
  #     - POSTGRES_PASSWORD=changeme
  #     - POSTGRES_DB=thalos
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - thalos-network

  # Uncomment for Redis
  # redis:
  #   image: redis:7-alpine
  #   container_name: thalos-cache
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - thalos-network

networks:
  thalos-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
