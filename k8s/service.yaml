apiVersion: v1
kind: Service
metadata:
  name: thalos-prime
  namespace: thalos-prime
  labels:
    app: thalos-prime
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: thalos-prime
