apiVersion: apps/v1
kind: Deployment
metadata:
  name: thalos-prime
  namespace: thalos-prime
  labels:
    app: thalos-prime
    version: v2.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: thalos-prime
  template:
    metadata:
      labels:
        app: thalos-prime
        version: v2.0.0
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: thalos-prime
        # Replace with an immutable registry image digest before deployment.
        # The placeholder intentionally prevents accidental use of a mutable :latest tag.
        image: registry.example.invalid/thalos-prime@sha256:REPLACE_WITH_IMAGE_DIGEST
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        envFrom:
        - configMapRef:
            name: thalos-prime-config
        - secretRef:
            name: thalos-prime-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL
      restartPolicy: Always
