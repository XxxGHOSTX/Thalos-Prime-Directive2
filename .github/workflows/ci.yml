name: CI

on:
    pull_request:
        branches: [main, develop]
    push:
        branches: [main, develop]

permissions:
    contents: read

jobs:
    lint:
        name: Lint Code
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '18'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run linter
              run: npm run lint

            - name: Check formatting
              run: npm run format:check

    test:
        name: Run Tests
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '18'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test

            - name: Upload coverage
              uses: codecov/codecov-action@v3
              with:
                  files: ./coverage/lcov.info
                  flags: unittests
                  name: codecov-umbrella

    build:
        name: Build Docker Image
        runs-on: ubuntu-latest
        needs: [lint, test]
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: false
                  tags: thalos-prime:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
