name: CI

on:
    pull_request:
        branches: [main, develop]
    push:
        branches: [main, develop]

permissions:
    contents: read

jobs:
  lint:
    name: Lint Python Code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black
          pip install -r requirements.txt

      - name: Run linter
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check formatting
        run: black --check .

  test:
    name: Validate Python Modules
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate module imports
        run: |
          python -m py_compile THALOS_PRIME_APP.py
          python -m py_compile thalos_sbi_core_v6.py
          python -m py_compile perpetual_optimizer.py
          python -m py_compile compliance_scanner.py
          python -m py_compile hyper_nextus_server.py
          python -m py_compile thalos_database_schema.py
          python -m py_compile deploy_server.py
          echo "✓ All modules compiled successfully"

  verify:
    name: Verify System Components
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database schema
        run: python thalos_database_schema.py

      - name: Verify database creation
        run: test -f thalos_prime_evolution.db
